apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "manager.fullname" . }}-config
  labels:
    {{- include "manager.labels" . | nindent 4 }}
data:
  # Non-secret runtime metadata about the Helm release. Mounted nowhere by
  # default; included so operators can extend the chart without needing to
  # add a ConfigMap of their own.
  chart-version: {{ .Chart.Version | quote }}
  app-version: {{ .Chart.AppVersion | quote }}
  release-name: {{ .Release.Name | quote }}
