version: '3'

# Task targets for the CryptOS-PKI helm/ module.
# Requires on PATH: helm, golic.

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:
    desc: Lint every chart under charts/
    cmds:
      - helm lint charts/*

  test:
    desc: Render the manager chart with each values case and assert on the output
    cmds:
      - bash tests/manager-render.sh

  package:
    desc: Package the manager chart into the current directory
    cmds:
      - helm package charts/manager

  license:
    desc: Verify every source file carries the Apache 2.0 license header (CI; never writes).
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@v0.2.0
      - golic inject -t apache2 -c "2026 Shane" --dry -x
  license:fix:
    desc: Inject the Apache 2.0 header into any source file missing it.
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@v0.2.0
      - golic inject -t apache2 -c "2026 Shane"

  ci:
    desc: Full local validation chain (lint, render tests)
    cmds:
      - task: lint
      - task: test
