version: '3'

# Task targets for the CryptOS-PKI helm/ module.
# Requires on PATH: helm, golic.

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:
    desc: Lint every chart under charts/
    cmds:
      - helm lint charts/*

  package:
    desc: Package the manager chart into the current directory
    cmds:
      - helm package charts/manager

  license:
    desc: Verify every source file carries the Apache 2.0 license header and LICENSE is the verbatim Apache 2.0 text (CI; never writes).
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@v1.2.0
      - golic inject -t apache2 -c "The CryptOS Authors." --license-file --dry -x
  license:fix:
    desc: Inject the Apache 2.0 header into any source file missing it and rewrite LICENSE to the verbatim Apache 2.0 text.
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@v1.2.0
      - golic inject -t apache2 -c "The CryptOS Authors." --license-file

  ci:
    desc: Full local validation chain (lint)
    cmds:
      - task: lint
